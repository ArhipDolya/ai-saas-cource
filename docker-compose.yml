services:
  bot:
    build: .
    init: true
    env_file:
      - .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
    command:
      - watchfiles
      - --filter
      - python
      - --target-type
      - command
      - python -m app.main
      - /app/app
    stop_grace_period: 30s

  frontend:
    build: ./frontend
    init: true
    environment:
      VITE_PROXY_TARGET: "http://bot:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/frontend/src:ro
      - ./frontend/index.html:/frontend/index.html:ro
    depends_on:
      - bot
